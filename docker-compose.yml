# Un único punto de entrada HTTP (edge, puerto 80) más los puertos UDP de MoQ (4433) y WebRTC (8189). Un proxy inverso externo
# con HTTPS (p. ej. Nginx Proxy Manager) solo tiene que reenviar al puerto 80.
# Red de dos tramos: DASH y MoQ solo se alcanzan a través del router, que emula el enlace.
# La ingesta (orquestador -> nginx / relay) va por la red interna "core" y no se degrada.
#
# Variables opcionales (fichero .env): HTTP_PORT (80), MOQ_PORT (4433), PUBLIC_HOST (localhost), el nombre
# con el que el navegador accede, para el certificado autofirmado del relay, y MOQ_HOST, la dirección a la
# que el navegador debe conectar por MoQ cuando el nombre de la página apunta a un proxy y no a este servidor.
# DASH va siempre directo al router, como MoQ y WebRTC, nunca por el punto de entrada. Con DASH_HOST (un nombre DNS que
# apunte a este servidor) y DUCKDNS_TOKEN (para obtener su certificado), por HTTPS a DASH_PORT (8443); sin ellas, solo
# desde páginas HTTP, por HTTP a DASH_HTTP_PORT (8080). En una página HTTPS sin DASH_HOST no hay DASH.
#
# Las versiones de los servidores de terceros van fijadas (MOQ_RELAY_VERSION, MEDIAMTX_VERSION): con
# "latest" cambiarían solas al volver a descargar la imagen y dos medidas dejarían de ser comparables.
# Para actualizar, cambiar aquí los dos valores por defecto de cada una y volver a desplegar.
services:
  # Entrada HTTP única: reparte entre dashboard, API y huella del certificado (DASH no pasa por aquí)
  edge:
    image: nginx:alpine
    container_name: testbed-edge
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./edge/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./edge/locations.conf:/etc/nginx/locations.conf:ro
    networks:
      - default
      - core
    depends_on:
      - router
      - web
      - orchestrator
    restart: unless-stopped

  # 0. Router de emulación de red (tc + netem) entre el navegador y los servidores finales
  router:
    build: ./router
    container_name: testbed-router
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.ip_forward=1
    environment:
      - NGINX_IP=172.30.50.10
      - RELAY_IP=172.30.50.11
      - RTC_SERVER=${RTC_SERVER:-mediasoup}  # servidor de WebRTC al que va UDP 8189 (docs/architecture.md)
      - MEDIAMTX_IP=172.30.50.12
      - SFU_IP=172.30.50.13
    ports:
      - "${MOQ_PORT:-4433}:4433/udp"   # MoQ / QUIC -> moq-relay:4433 (el navegador va directo)
      - "8189:8189/udp"                # WebRTC (ICE, DTLS, SRTP) -> servidor WebRTC:8189 (el navegador va directo)
      - "8189:8189/tcp"                # WebRTC con mediasoup: señalización WebSocket -> sfu:8189 (el navegador va directo)
      - "${DASH_PORT:-8443}:8443/tcp"  # LL-DASH con TLS -> nginx-dash:443 (el navegador va directo, si hay DASH_HOST)
      - "${DASH_HTTP_PORT:-8080}:8080/tcp"  # LL-DASH sin TLS -> nginx-dash:80 (el navegador va directo: sin DASH_HOST, desde páginas HTTP)
    networks:
      default:
      core:
        ipv4_address: 172.30.50.2
    restart: unless-stopped

  # 1. MoQ Relay: la imagen oficial publicada (moqdev/moq-relay, versión fijada) o, con MOQ_RELAY_FROM=git,
  # compilado desde MOQ_RELAY_COMMIT (relay/Dockerfile). Los valores por defecto repiten los
  # de relay/Dockerfile.
  moq-relay:
    build:
      context: ./relay
      args:
        MOQ_RELAY_FROM: ${MOQ_RELAY_FROM:-release}
        MOQ_RELAY_VERSION: ${MOQ_RELAY_VERSION:-0.17.9}
        MOQ_RELAY_COMMIT: ${MOQ_RELAY_COMMIT:-c19c723d90c6e8df60c9a656cc2a4d92ee358295}
    image: testbed-moq-relay
    container_name: testbed-moq-relay
    command: >
      --listen 0.0.0.0:4433
      --listen-tls-generate ${PUBLIC_HOST:-localhost}
      --web-http-listen 0.0.0.0:8081
      --auth-public anon/**
    networks:
      core:
        ipv4_address: 172.30.50.11
    restart: unless-stopped

  # SFU de WebRTC (RTC_SERVER=mediasoup, por defecto): recibe por RTP todas las calidades, sin recodificar, y elige
  # la capa de cada espectador. La versión de mediasoup está fijada en sfu/package.json y sfu/package-lock.json.
  sfu:
    build: ./sfu
    container_name: testbed-sfu
    environment:
      # Como en MediaMTX: dirección que se anuncia al navegador en los candidatos ICE
      - ANNOUNCED_ADDRESS=${MOQ_HOST:-127.0.0.1}
      - SFU_TRACE=${SFU_TRACE:-}  # 1: traza de la estimación y los sondeos en su registro (diagnóstico)
      # Con DASH_HOST y su certificado (el de DASH directo), la señalización acepta también wss://, para páginas en HTTPS
      - DASH_HOST=${DASH_HOST:-}
    volumes:
      - ./certs/dash:/certs:ro
    networks:
      core:
        ipv4_address: 172.30.50.13
    restart: unless-stopped

  # Servidor WebRTC alternativo (RTC_SERVER=mediamtx): recibe la calidad más alta, sin recodificar, y la sirve por WHEP
  mediamtx:
    image: bluenviron/mediamtx:${MEDIAMTX_VERSION:-1.21.3}
    container_name: testbed-mediamtx
    environment:
      # Dirección que se anuncia al navegador en los candidatos ICE: debe ser la de este servidor tal como
      # la alcanza el navegador (la misma que MOQ_HOST detrás de un proxy; 127.0.0.1 en local)
      - MTX_WEBRTCADDITIONALHOSTS=${MOQ_HOST:-127.0.0.1}
      - MTX_WEBRTCLOCALUDPADDRESS=:8189
      - MTX_WEBRTCIPSFROMINTERFACES=no
      # Ingesta directa por UDP (RTC_INGEST=udp, por defecto): la compuerta de WebRTC envía aquí el MPEG-TS de la
      # calidad más alta, sin audio a 5003 (liveudp) y con audio a 5013 (liveudpa): MediaMTX fija las pistas de
      # un path UDP al empezar a leerlo. El path live, con publicación por RTSP, sigue para RTC_INGEST=rtsp.
      - MTX_PATHS_LIVEUDP_SOURCE=udp+mpegts://0.0.0.0:5003
      - MTX_PATHS_LIVEUDPA_SOURCE=udp+mpegts://0.0.0.0:5013
      - MTX_RTMP=no
      - MTX_HLS=no
      - MTX_SRT=no
    networks:
      core:
        ipv4_address: 172.30.50.12
    restart: unless-stopped

  # 2. Servidor Nginx para entrega HTTP de LL-DASH: reenvía sin búfer al origen chunked del orquestador
  nginx-dash:
    image: nginx:alpine
    container_name: testbed-nginx-dash
    entrypoint: ["/bin/sh", "/dash-entrypoint.sh"]
    environment:
      - DASH_HOST=${DASH_HOST:-}
    volumes:
      - ./server/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./server/dash-direct.conf.template:/etc/nginx/direct.conf.template:ro
      - ./server/dash-entrypoint.sh:/dash-entrypoint.sh:ro
      - ./certs/dash:/certs:ro
    networks:
      core:
        ipv4_address: 172.30.50.10
    restart: unless-stopped

  # Certificado del puerto directo de DASH (Let's Encrypt, reto DNS de DuckDNS). Inactivo sin DASH_HOST.
  dash-cert:
    image: neilpang/acme.sh:3.1.1
    container_name: testbed-dash-cert
    entrypoint: ["/bin/sh", "/dash-cert.sh"]
    environment:
      - DASH_HOST=${DASH_HOST:-}
      - DUCKDNS_TOKEN=${DUCKDNS_TOKEN:-}
    volumes:
      - ./server/dash-cert.sh:/dash-cert.sh:ro
      - ./certs/dash:/certs
    restart: unless-stopped

  # 3. Orquestador FastAPI + FFmpeg (Codificación de BBB y publicación dual)
  orchestrator:
    build:
      context: ./server
      dockerfile: Dockerfile
      # Publicador moq-cli: "release" (el publicado MOQ_CLI_VERSION, por defecto) o "git" (compilado desde
      # MOQ_CLI_COMMIT). Los valores por defecto repiten los de server/Dockerfile.
      args:
        MOQ_CLI_FROM: ${MOQ_CLI_FROM:-release}
        MOQ_CLI_VERSION: ${MOQ_CLI_VERSION:-0.14.7}
        MOQ_CLI_COMMIT: ${MOQ_CLI_COMMIT:-bc64b9c52561209322dcb8dec9992bf867f499f7}
    container_name: testbed-orchestrator
    init: true  # recoge los procesos FFmpeg huérfanos al reiniciar pipelines
    environment:
      - MOQ_RELAY_URL=https://moq-relay:4433/anon
      - ROUTER_URL=http://172.30.50.2:9000
      - MOQ_PORT=${MOQ_PORT:-4433}
      - MOQ_HOST=${MOQ_HOST:-}
      - DASH_HOST=${DASH_HOST:-}
      - DASH_PORT=${DASH_PORT:-8443}
      - DASH_HTTP_PORT=${DASH_HTTP_PORT:-8080}
      # Cámara RTSP como fuente alternativa al bucle (docs/measurement.md); la URL puede llevar credenciales
      - CAMERA_RTSP_URL=${CAMERA_RTSP_URL:-}
      - CAMERA_FPS=${CAMERA_FPS:-}
      - RTC_PUBLISH_URL=rtsp://172.30.50.12:8554/live
      - RTC_SERVER=${RTC_SERVER:-mediasoup}  # mediasoup: SFU con simulcast; mediamtx: una calidad, sin adaptación
      - RTC_INGEST=${RTC_INGEST:-udp}  # solo con MediaMTX. udp: directo; rtsp: con un FFmpeg intermedio que publica por RTSP
      # Solo para mostrarlas en el dashboard: deben coincidir con las etiquetas de imagen de arriba
      - MOQ_RELAY_VERSION=${MOQ_RELAY_VERSION:-0.17.9}
      # Con el relay compilado (MOQ_RELAY_FROM=git), el panel y el CSV lo muestran como git@<commit>
      - MOQ_RELAY_FROM=${MOQ_RELAY_FROM:-release}
      - MOQ_RELAY_COMMIT=${MOQ_RELAY_COMMIT:-c19c723d90c6e8df60c9a656cc2a4d92ee358295}
      - MEDIAMTX_VERSION=${MEDIAMTX_VERSION:-1.21.3}
      - MEDIASOUP_VERSION=3.32.1  # debe coincidir con sfu/package.json
    networks:
      - default
      - core
    volumes:
      - ./media:/data  # vídeo fuente; si falta, el orquestador lo descarga aquí al arrancar
      - ./server/app:/app/app
      - ./scripts:/app/scripts:ro  # el trabajador de campañas y su instalador, que sirve /api/worker/
    depends_on:
      - moq-relay
      - nginx-dash
      - mediamtx
      - sfu
      - router
    restart: unless-stopped

  # 4. Dashboard Web (React + TypeScript + Chart.js en puerto 5173)
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      # @moq/watch y sus @moq/*: "release" (npm, por defecto) o "git" (compilados desde MOQ_WATCH_COMMIT).
      # Los valores por defecto repiten los de web/Dockerfile.
      args:
        MOQ_WATCH_FROM: ${MOQ_WATCH_FROM:-release}
        MOQ_WATCH_COMMIT: ${MOQ_WATCH_COMMIT:-bc64b9c52561209322dcb8dec9992bf867f499f7}
        MOQ_WATCH_PATCHES: ${MOQ_WATCH_PATCHES:-1}  # 0: sin los parches de web/patches/ (otro commit)
        MOQ_WATCH_BUN: ${MOQ_WATCH_BUN:-1.3.5}  # bun para compilar moq: 1.4.4 con commits desde c19c723
    container_name: testbed-web
    depends_on:
      - orchestrator
    restart: unless-stopped

networks:
  core:
    ipam:
      config:
        - subnet: 172.30.50.0/24
          # Las direcciones automáticas salen de la mitad alta, para que nunca ocupen las fijas de arriba
          ip_range: 172.30.50.128/25
