# Banco de pruebas en Docker Compose (docs/deployment.md). Dos modos, según el .env:
# - En local, sin .env: http://localhost, sin certificado; el relay de MoQ genera uno autofirmado que el navegador fija
#   por su huella, y DASH va por HTTP (8080).
# - En un servidor: SERVER_HOST, un nombre DNS que apunta a él, y ACME_DNS con su token (.env.template). El contenedor
#   cert obtiene un certificado de Let's Encrypt para ese nombre, que usan la página (443), DASH (8443), el relay (4433) y
#   la señalización de mediasoup (8189/tcp). La página queda en https://<SERVER_HOST>.
# Red de dos tramos: DASH, MoQ y WebRTC solo se alcanzan a través del router, que emula el enlace. La ingesta
# (orquestador -> nginx-dash / relay / SFU) va por la red interna "core" y no se degrada. La página (nginx-web) no
# pasa por el router.
#
# Las versiones de los servidores de terceros van fijadas (MOQ_RELAY_VERSION, MEDIAMTX_VERSION): con
# "latest" cambiarían solas al volver a descargar la imagen y dos medidas dejarían de ser comparables.
# Para actualizar, cambiar aquí los dos valores por defecto de cada una y volver a desplegar.
services:
  # La página, la API y la huella del relay (DASH no pasa por aquí). Con SERVER_HOST, también por HTTPS
  nginx-web:
    image: nginx:alpine
    container_name: testbed-nginx-web
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    ports:
      - "80:80"
      - "443:443"
    environment:
      - SERVER_HOST=${SERVER_HOST:-}
    volumes:
      - ./nginx/entrypoint.sh:/entrypoint.sh:ro
      - ./nginx/web.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/web-tls.conf.template:/etc/nginx/tls.conf.template:ro
      - ./certs:/certs:ro
    networks:
      - default
      - core
    depends_on:
      - router
      - web
      - orchestrator
    restart: unless-stopped

  # 0. Router de emulación de red (tc + netem) entre el navegador y los servidores finales
  router:
    build: ./router
    container_name: testbed-router
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.ip_forward=1
    environment:
      - NGINX_IP=172.30.50.10
      - RELAY_IP=172.30.50.11
      - RTC_SERVER=${RTC_SERVER:-mediasoup}  # servidor de WebRTC al que va UDP 8189 (docs/architecture.md)
      - MEDIAMTX_IP=172.30.50.12
      - SFU_IP=172.30.50.13
    ports:
      - "4433:4433/udp"  # MoQ / QUIC -> moq-relay:4433
      - "8189:8189/udp"  # WebRTC (ICE, DTLS, SRTP) -> servidor WebRTC:8189
      - "8189:8189/tcp"  # WebRTC con mediasoup: señalización WebSocket -> sfu:8189
      - "8443:8443/tcp"  # LL-DASH con TLS -> nginx-dash:443 (con SERVER_HOST)
      - "8080:8080/tcp"  # LL-DASH sin TLS -> nginx-dash:80 (en local, desde páginas HTTP)
    networks:
      default:
      core:
        ipv4_address: 172.30.50.2
    restart: unless-stopped

  # 1. MoQ Relay: por defecto la última imagen publicada (moqdev/moq-relay:latest), o una versión concreta
  # (MOQ_RELAY_VERSION) o compilado desde commit (MOQ_RELAY_FROM=git + MOQ_RELAY_COMMIT).
  moq-relay:
    build:
      context: ./relay
      args:
        MOQ_RELAY_FROM: ${MOQ_RELAY_FROM:-release}
        MOQ_RELAY_VERSION: ${MOQ_RELAY_VERSION:-latest}
        MOQ_RELAY_COMMIT: ${MOQ_RELAY_COMMIT:-c19c723d90c6e8df60c9a656cc2a4d92ee358295}
    image: testbed-moq-relay
    container_name: testbed-moq-relay
    environment:
      - SERVER_HOST=${SERVER_HOST:-}
    volumes:
      - ./certs:/certs:ro
      # Socket del servidor de autorización, que corre en el orquestador (server/app/moqauth.py)
      - moq-auth:/run/moq-auth
      - versions:/run/versions
    networks:
      core:
        ipv4_address: 172.30.50.11
    restart: unless-stopped

  # SFU de WebRTC (RTC_SERVER=mediasoup, por defecto): recibe por RTP todas las calidades, sin recodificar, y elige
  # la capa de cada espectador. Por defecto instala la última versión de mediasoup salvo MEDIASOUP_VERSION en el .env.
  sfu:
    build:
      context: ./sfu
      args:
        MEDIASOUP_VERSION: ${MEDIASOUP_VERSION:-latest}
    container_name: testbed-sfu
    environment:
      # Con SERVER_HOST, anuncia en los candidatos ICE la IP a la que resuelve (o SERVER_IP, si se da) y la señalización
      # acepta también wss:// con su certificado; sin él, 127.0.0.1 y solo ws://
      - SERVER_HOST=${SERVER_HOST:-}
      - SERVER_IP=${SERVER_IP:-}
      - SFU_TRACE=${SFU_TRACE:-}  # 1: traza de la estimación y los sondeos en su registro (diagnóstico)
    volumes:
      - ./certs:/certs:ro
    networks:
      core:
        ipv4_address: 172.30.50.13
    restart: unless-stopped

  # Servidor WebRTC alternativo (RTC_SERVER=mediamtx): recibe la calidad más alta, sin recodificar, y la sirve por WHEP
  mediamtx:
    build:
      context: ./mediamtx
      args:
        MEDIAMTX_VERSION: ${MEDIAMTX_VERSION:-latest}
    image: testbed-mediamtx
    container_name: testbed-mediamtx
    environment:
      # Señalización WHEP en 8189/tcp, por el router como la de mediasoup; con SERVER_HOST, por HTTPS con su
      # certificado (mediamtx/entrypoint.sh)
      - SERVER_HOST=${SERVER_HOST:-}
      - MTX_WEBRTCADDRESS=:8189
      # Dirección que se anuncia al navegador en los candidatos ICE: la de este servidor tal como la alcanza el
      # navegador (SERVER_IP o, si no se da, SERVER_HOST; 127.0.0.1 en local)
      - MTX_WEBRTCADDITIONALHOSTS=${SERVER_IP:-${SERVER_HOST:-127.0.0.1}}
      - MTX_WEBRTCLOCALUDPADDRESS=:8189
      - MTX_WEBRTCIPSFROMINTERFACES=no
      # Ingesta directa por UDP: la compuerta de WebRTC envía aquí el MPEG-TS de la calidad más alta, sin audio a
      # 5003 (liveudp) y con audio a 5013 (liveudpa): MediaMTX fija las pistas de un path UDP al empezar a leerlo.
      - MTX_PATHS_LIVEUDP_SOURCE=udp+mpegts://0.0.0.0:5003
      - MTX_PATHS_LIVEUDPA_SOURCE=udp+mpegts://0.0.0.0:5013
      - MTX_RTSP=no
      - MTX_RTMP=no
      - MTX_HLS=no
      - MTX_SRT=no
      - MTX_MOQ=no  # su propio servidor MoQ, encendido por defecto: aquí no se usa
    volumes:
      - ./certs:/certs:ro
      - versions:/run/versions
    networks:
      core:
        ipv4_address: 172.30.50.12
    restart: unless-stopped

  # 2. LL-DASH, solo a través del router: reenvía sin búfer al origen chunked del orquestador. Con SERVER_HOST, por
  # HTTPS (8443 en el router); sin él, por HTTP (8080)
  nginx-dash:
    image: nginx:alpine
    container_name: testbed-nginx-dash
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    environment:
      - SERVER_HOST=${SERVER_HOST:-}
    volumes:
      - ./nginx/entrypoint.sh:/entrypoint.sh:ro
      - ./nginx/dash.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/dash-tls.conf.template:/etc/nginx/tls.conf.template:ro
      - ./certs:/certs:ro
    networks:
      core:
        ipv4_address: 172.30.50.10
    restart: unless-stopped

  # Certificado de Let's Encrypt para SERVER_HOST (reto DNS con la API ACME_DNS de acme.sh). Inactivo sin SERVER_HOST.
  # Lee el .env entero: las variables del token tienen el nombre que espera acme.sh (DuckDNS_Token, CF_Token...)
  cert:
    image: neilpang/acme.sh:3.1.1
    container_name: testbed-cert
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    env_file:
      - path: .env
        required: false
    volumes:
      - ./cert/entrypoint.sh:/entrypoint.sh:ro
      - ./certs:/certs
    restart: unless-stopped

  # 3. Orquestador FastAPI + FFmpeg (Codificación de BBB y publicación dual)
  orchestrator:
    build:
      context: ./server
      dockerfile: Dockerfile
      # Publicador moq-cli: "release" (el publicado MOQ_CLI_VERSION, por defecto) o "git" (compilado desde
      # MOQ_CLI_COMMIT). Los valores por defecto repiten los de server/Dockerfile.
      args:
        MOQ_CLI_FROM: ${MOQ_CLI_FROM:-release}
        MOQ_CLI_VERSION: ${MOQ_CLI_VERSION:-latest}
        MOQ_CLI_COMMIT: ${MOQ_CLI_COMMIT:-bc64b9c52561209322dcb8dec9992bf867f499f7}
    container_name: testbed-orchestrator
    init: true  # recoge los procesos FFmpeg huérfanos al reiniciar pipelines
    environment:
      - MOQ_RELAY_URL=https://moq-relay:4433/anon
      - SERVER_HOST=${SERVER_HOST:-}  # nombre al que el navegador pide DASH, MoQ y la señalización; vacío en local
      # Cámara RTSP como fuente alternativa al bucle (docs/measurement.md); la URL puede llevar credenciales
      - CAMERA_RTSP_URL=${CAMERA_RTSP_URL:-}
      - CAMERA_FPS=${CAMERA_FPS:-}
      - RTC_SERVER=${RTC_SERVER:-mediasoup}  # mediasoup: SFU con simulcast; mediamtx: una calidad, sin adaptación
      - RTC_PACING_FACTOR=${RTC_PACING_FACTOR:-2.5}  # ritmo del pacer de la ingesta (rtc_pacing) respecto al bitrate
    networks:
      - default
      - core
    volumes:
      - ./media:/data  # vídeo fuente; si falta, el orquestador lo descarga aquí al arrancar
      - ./server/app:/app/app
      - ./scripts:/app/scripts:ro  # el trabajador de campañas y su instalador, que sirve /api/worker/
      - moq-auth:/run/moq-auth  # socket de la autorización del relay de MoQ (server/app/moqauth.py)
      - versions:/run/versions:ro  # versiones reales anotadas por moq-relay y mediamtx al arrancar
    depends_on:
      - moq-relay
      - nginx-dash
      - mediamtx
      - sfu
      - router
    restart: unless-stopped

  # 4. Dashboard Web (React + TypeScript + Chart.js en puerto 5173)
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      # Reproductores: por defecto la última versión publicada en npm, salvo que se fije en el .env
      # (o MOQ_WATCH_FROM=git para compilar @moq/* desde MOQ_WATCH_COMMIT).
      args:
        MOQ_WATCH_FROM: ${MOQ_WATCH_FROM:-release}
        MOQ_WATCH_VERSION: ${MOQ_WATCH_VERSION:-latest}
        MOQ_WATCH_COMMIT: ${MOQ_WATCH_COMMIT:-bc64b9c52561209322dcb8dec9992bf867f499f7}
        MOQ_WATCH_PATCHES: ${MOQ_WATCH_PATCHES:-1}  # 0: sin los parches de web/patches/ (otro commit)
        MOQ_WATCH_BUN: ${MOQ_WATCH_BUN:-1.3.5}  # bun para compilar moq: 1.4.4 con commits desde c19c723
        DASHJS_VERSION: ${DASHJS_VERSION:-latest}
        MEDIASOUP_CLIENT_VERSION: ${MEDIASOUP_CLIENT_VERSION:-latest}
    container_name: testbed-web
    depends_on:
      - orchestrator
    restart: unless-stopped

volumes:
  # Solo el socket por el que el relay pregunta al orquestador si admite cada sesión de MoQ
  moq-auth:
  # Versiones reales que moq-relay y mediamtx anotan al arrancar para el panel del dashboard
  versions:

networks:
  core:
    ipam:
      config:
        - subnet: 172.30.50.0/24
          # Las direcciones automáticas salen de la mitad alta, para que nunca ocupen las fijas de arriba
          ip_range: 172.30.50.128/25
