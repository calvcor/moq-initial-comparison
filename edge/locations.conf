# Rutas del punto de entrada, comunes al puerto 80 y, con docker-compose.tls.yml, al 443.
# API de control y de medida del orquestador
location ~ ^/(api/|docs|openapi\.json) {
    set $orchestrator http://orchestrator:8000;
    proxy_pass $orchestrator;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    # La IP del navegador, para el router (pruebas en paralelo: cada trabajador con su cola; docs/campaigns.md)
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Lo que pintó cada reproductor en una prueba de QoE: unos 25 bytes por frame (300 s a 60 fps, ~0,5 MB)
    client_max_body_size 8m;
}

# LL-DASH no pasa nunca por el punto de entrada (ni, por tanto, por un proxy delante de la página): el navegador va
# directo al router, como MoQ y WebRTC: un proxy terminaría la conexión TCP del navegador y la red emulada actuaría
# sobre otra (docs/deployment.md).
location /media/dash/ {
    return 404;
}

# Señalización WebRTC (WHEP) de MediaMTX; el vídeo va después directo por UDP
location /rtc/ {
    proxy_pass http://172.30.50.12:8889/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
}

# Dashboard
location / {
    set $web http://web:80;
    proxy_pass $web;
    proxy_set_header Host $http_host;
}
