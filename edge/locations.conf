# Rutas del punto de entrada, comunes al puerto 80 y, con docker-compose.tls.yml, al 443.
# API de control y de medida del orquestador
location ~ ^/(api/|docs|openapi\.json) {
    set $orchestrator http://orchestrator:8000;
    proxy_pass $orchestrator;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    # La IP del navegador, para el router (pruebas en paralelo: cada trabajador con su cola; README 4.8)
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Lo que pintó cada reproductor en una prueba de QoE: unos 25 bytes por frame (300 s a 60 fps, ~0,5 MB)
    client_max_body_size 8m;
}

# Manifiesto y segmentos CMAF, sin búfer para no retener los fragmentos de baja latencia
location /media/dash/ {
    proxy_pass http://dash_via_router;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
}

# Señalización WebRTC (WHEP) de MediaMTX; el vídeo va después directo por UDP
location /rtc/ {
    proxy_pass http://172.30.50.12:8889/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
}

# Dashboard
location / {
    set $web http://web:80;
    proxy_pass $web;
    proxy_set_header Host $http_host;
}
