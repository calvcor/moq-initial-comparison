# Punto de entrada único del testbed (puerto 80). Todo lo que pide el navegador por HTTP pasa por aquí
# y se reparte internamente; un proxy inverso externo con HTTPS solo tiene que reenviar a este puerto.
# Ni MoQ, ni WebRTC, ni LL-DASH pasan por aquí: el navegador va directo a sus puertos en el router de emulación.
events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nodelay   on;

    # DNS interno de Docker: los servicios se resuelven en cada petición, no solo al arrancar
    resolver 127.0.0.11 valid=10s;

    # Con docker-compose.tls.yml, el servidor HTTPS del puerto 443 (edge/tls.conf.template)
    include /etc/nginx/tls/*.conf;

    server {
        listen 80;
        server_name _;

        # Huella del certificado autofirmado del relay MoQ, para fijarlo en WebTransport
        location = /certificate.sha256 {
            proxy_pass http://172.30.50.11:8081;
        }

        include /etc/nginx/locations.conf;
    }
}
