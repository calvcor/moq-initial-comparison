# nginx-dash: LL-DASH, solo a través del router de emulación, de modo que la conexión TCP del navegador es la que
# atraviesa la red emulada (como la de MoQ y la de WebRTC). En local, por HTTP (80 aquí, 8080 en el router); con
# SERVER_HOST, por HTTPS (443 aquí, 8443 en el router). Reenvía al origen en memoria del orquestador, que pone las
# cabeceras CORS y el tipo de contenido.
events {
    worker_connections 1024;
}

http {
    tcp_nodelay on;

    # DNS interno de Docker: con el nombre en una variable, el orquestador se resuelve en cada petición
    resolver 127.0.0.11 valid=10s;

    # Un solo servidor para los dos puertos. Solo HTTP/1.1 (sin http2): HTTP/2 metería vídeo y audio en una misma
    # conexión TCP y cambiaría lo que se mide.
    server {
        listen 80;

        # Con SERVER_HOST, entrypoint.sh deja aquí el puerto 443 con el certificado (dash-tls.conf.template)
        include /etc/nginx/tls/*.conf;

        location /media/dash/ {
            set $origin http://orchestrator:8000;
            proxy_pass $origin;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            # Sin búfer: cada trozo del fragmento CMAF sale en cuanto el origen lo entrega
            proxy_buffering off;
            proxy_cache off;
            # Permite al dashboard leer el tamaño transferido de cada petición (Resource Timing API)
            add_header Timing-Allow-Origin "*" always;
        }
    }
}
