# nginx-web: la página, la API y la huella del relay, en el puerto 80 y, con SERVER_HOST, también en el 443 con TLS.
# No pasa por el router de emulación. Ni MoQ, ni WebRTC, ni LL-DASH pasan por aquí: el navegador va directo a sus
# puertos en el router.
events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nodelay   on;

    # DNS interno de Docker: con el nombre en una variable, los servicios se resuelven en cada petición y no solo al
    # arrancar (nginx no arrancaría si alguno faltara entonces, y seguiría con su IP vieja si se recreara)
    resolver 127.0.0.11 valid=10s;

    # Un solo servidor para los dos puertos: las mismas rutas por HTTP y por HTTPS
    server {
        listen 80;
        server_name _;

        # Con SERVER_HOST, entrypoint.sh deja aquí el puerto 443 con el certificado (web-tls.conf.template). Solo
        # HTTP/1.1, como el 80.
        include /etc/nginx/tls/*.conf;

        # Huella del certificado autofirmado del relay MoQ (solo en local, sin SERVER_HOST), para fijarlo en
        # WebTransport. Por HTTPS el relay usa el certificado de Let's Encrypt, que WebTransport valida como cualquier
        # otro: Chrome rechazaría fijarlo, porque serverCertificateHashes exige una validez de 14 días como máximo.
        location = /certificate.sha256 {
            if ($https) {
                return 404;
            }
            set $relay http://moq-relay:8081;
            proxy_pass $relay;
        }

        # API de control y de medida del orquestador
        location ~ ^/(api/|docs|openapi\.json) {
            set $orchestrator http://orchestrator:8000;
            proxy_pass $orchestrator;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            # La IP del navegador, para el router (pruebas en paralelo: cada trabajador con su cola; docs/campaigns.md)
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # http o https, según por qué puerto llegó: con él, el instalador de trabajadores arma la dirección del
            # orquestador (/api/worker/install.sh)
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 8m;
        }

        # Dashboard
        location / {
            set $web http://web:80;
            proxy_pass $web;
            proxy_set_header Host $http_host;
        }
    }
}
